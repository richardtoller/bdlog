<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scores</title>
  <meta name="description" content="View and organise your sheet music and build concert programmes.">
  <meta name="theme-color" content="#5c1a26">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Scores">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn back" aria-label="Back" hidden>‹</button>
    <h1 id="title">Scores</h1>
    <div id="top-actions"></div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="songs" class="active"><span class="ico" aria-hidden="true">♪</span><span>Songs</span></button>
    <button data-tab="programmes"><span class="ico" aria-hidden="true">☰</span><span>Programmes</span></button>
    <button data-tab="library"><span class="ico" aria-hidden="true">⚙</span><span>Library</span></button>
  </nav>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheet-body"></div>
  </section>

  <div id="viewer" class="viewer" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <input type="file" id="pick-folder" webkitdirectory multiple hidden>
  <input type="file" id="pick-files" accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/*" multiple hidden>
  <input type="file" id="pick-backup" accept=".json,application/json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
