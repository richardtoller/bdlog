<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bird Log</title>
  <meta name="description" content="Log UK bird species seen on a trip and export the list to your blog.">
  <meta name="theme-color" content="#2f5d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bird Log">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Bird Log</h1>
    <div id="top-actions"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="log" class="active"><span class="ico" aria-hidden="true">📋</span><span>Log</span></button>
    <button data-tab="species"><span class="ico" aria-hidden="true">🔎</span><span>Species</span></button>
    <button data-tab="guides"><span class="ico" aria-hidden="true">📖</span><span>ID Guides</span></button>
    <button data-tab="trips"><span class="ico" aria-hidden="true">🧭</span><span>Trips</span></button>
  </nav>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheet-body"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/birds.js"></script>
  <script src="js/guides.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
